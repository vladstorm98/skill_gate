spring:
  application:
    name: skill_gate
  main:
    banner-mode: off

  # Database
  datasource:
    #    url: jdbc:postgresql://db:5432/skill_gate_db
    url: jdbc:postgresql://localhost:5432/skill_gate_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true
    connect-retries: 30
    connect-retries-interval: 5000

  # Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
      clean-disabled: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          enabled: true
          max-active: 20
          max-idle: 10
          min-idle: 5

# Logging
logging:
  file:
    name: logs/app.log
  level:
    root: ERROR
    com:
      skill_gate: DEBUG
      skill_gate.Application: ERROR
      skill_gate.security.JwtAuthFilter: ERROR
    org:
      hibernate: ERROR

telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN}"
    username: "skill_gate_bot"
    developer-chat-id: 398466752

# JWT
jwt:
  secret: ${JWT_SECRET:change-me-not-used-yet}
  expiration: 86400

server:
  port: 8080   # для будущей web-админки
